    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        :root {
            --dark-color: #000;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(#fdf6e3, #f8e7c9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .fondo {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .girasol {
            position: absolute;
            animation: caer linear infinite;
        }

        @keyframes caer {
            0% {
                transform: translateY(-100px) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* CONTENEDOR PRINCIPAL DE LA TARJETA */
        .container-tarjeta {
            width: 500px;
            height: 680px;
            background: #ffffff;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 2;
            overflow: visible;
        }

        .decor-flor {
            position: absolute;
            width: 180px;
            z-index: 5;
            pointer-events: none;
        }

        .flor1 {
            top: -60px;
            left: -60px;
        }

        .flor2 {
            bottom: -60px;
            right: -60px;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 25px;
        }

        .slide.active {
            display: flex;
        }

        h1 {
            color: #6b8e23;
            font-size: 42px;
            text-align: center;
        }

        .slide p {
            text-align: center;
            color: #5c7a2c;
            font-size: 18px;
        }

        .slide img {
            width: 320px;
            max-width: 90%;
            margin-top: 10px;
            border-radius: 15px;
        }

        .botones {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .botones button {
            background: #8fbf5a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* ESTILOS DEL JARDÍN ANIMADO (INTEGRADOS DE MAIN.CSS) */
        #seccion-flores-animadas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            z-index: 10;
            background-color: var(--dark-color);
            overflow: hidden;
            perspective: 1000px;
        }

        #seccion-flores-animadas.active {
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .night {
            position: fixed;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            filter: blur(0.1vmin);
            background-image: radial-gradient(ellipse at top, transparent 0%, var(--dark-color)), 
            radial-gradient(ellipse at bottom, var(--dark-color), rgba(145, 233, 255, 0.2)), repeating-linear-gradient(220deg, rgb(0, 0, 0) 0px,
            rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), repeating-linear-gradient(189deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px),

    <!-- SCRIPTS -->
    <script>
        // Lógica de main.js integrada
        window.onload = () => {
            // Inicialización si es requerida
        };

        let current = 0;
        const slides = document.querySelectorAll(".slide");

        function nextSlide() {
            let next = current + 1;
            if (next >= slides.length) next = 0;
            showSlide(next);
        }

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle("active", i === index);
            });
            current = index;
        }

        // Función para alternar el jardín animado de forma independiente
        function toggleFloresAnimadas(mostrar) {
            const seccion = document.getElementById("seccion-flores-animadas");
            if (mostrar) {
                seccion.classList.add("active");
            } else {
                seccion.classList.remove("active");
            }
        }

        // Creación del fondo con lluvia de girasoles
        const fondo = document.getElementById("fondo");
        for (let i = 0; i < 25; i++) {
            let flor = document.createElement("img");
            flor.src = "https://www.pngmart.com/files/4/Sunflower-PNG-HD.png";
            flor.className = "girasol";
            flor.style.left = Math.random() * 100 + "vw";
            flor.style.animationDuration = (5 + Math.random() * 5) + "s";
            flor.style.width = (25 + Math.random() * 35) + "px";
            fondo.appendChild(flor);
        }


    </script>
